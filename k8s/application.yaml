apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-web
  namespace: capstone
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: capstone-web
  template:
    metadata:
      labels:
        app: capstone-web
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: capstone-web
      containers:
        - name: web
          image: IMAGE_REFERENCE
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: capstone-web
  namespace: capstone
spec:
  type: NodePort
  selector:
    app: capstone-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30008
